services:
  - type: web
    runtime: docker
    name: resonance-api
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OURA_TOKEN
        sync: false
      - key: OPENWEATHER_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
